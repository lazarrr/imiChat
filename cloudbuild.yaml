# Builds the Web API image and pushes it to Artifact Registry.
#
# Usage:
#   gcloud builds submit . --config=cloudbuild.yaml \
#     --substitutions=_IMAGE=us-central1-docker.pkg.dev/PROJECT/university-chatbot/web-api:latest
#
# The build context is the repository root (not src/) because the FastAPI
# code imports the top-level `config` package.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - src/Dockerfile
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 150
timeout: 1800s
